name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tidy uploaded files into folders
        run: |
          for f in *__*; do [ -f "$f" ] || continue; p="${f//__//}"; mkdir -p "$(dirname "$p")"; git mv -f "$f" "$p"; done
          git rm -q --ignore-unmatch hello.txt
          python3 scripts/make-logo.py
          cp DOOFUS.md DOOFUS-lite.md IDENTITY.md docs/
          git add -A docs/logo.svg docs/DOOFUS.md docs/DOOFUS-lite.md docs/IDENTITY.md
          if ! git diff --cached --quiet; then
            git config user.name "doofus-bot"
            git config user.email "doofus-bot@users.noreply.github.com"
            git commit -m "Tidy files into folders"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download sounds, GIFs and meme templates
        run: node scripts/fetch-assets.js || true
      - name: Build the page
        run: python3 scripts/build-page.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
